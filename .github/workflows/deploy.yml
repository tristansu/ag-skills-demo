name: Deploy to GitHub Pages

on:
  push:
    branches: [assignment-02-first-data]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Copernicus secrets
        env:
          CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
        run: |
          sed -i "s/{{COPERNICUS_CLIENT_ID}}/$CLIENT_ID/g" docs/assignment-02/field_map_6.html
          sed -i "s/{{COPERNICUS_CLIENT_SECRET}}/$CLIENT_SECRET/g" docs/assignment-02/field_map_6.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/assignment-02
