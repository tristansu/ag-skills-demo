<!doctype html>
<html>
  <head>
    <title>Custom Polygon Analysis - Field Data Retrieval</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #container {
        display: flex;
        height: 100vh;
      }

      #sidebar {
        width: 364px;
        background: #ffffff;
        border-right: 1px solid #ddd;
        padding: 20px;
        overflow-y: auto;
        flex-shrink: 0;
        transition: width 0.3s ease;
      }

      #sidebar.expanded {
        width: 546px;
      }

      #sidebar h1 {
        font-size: 1.2em;
        margin-bottom: 5px;
        color: #1b5e20;
      }

      .panel {
        margin: 20px 0;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 8px;
      }

      .panel h3 {
        font-size: 0.85em;
        color: #333;
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      .legend-item {
        display: flex;
        align-items: center;
        margin: 8px 0;
        font-size: 0.9em;
      }

      .legend-color {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        margin-right: 10px;
        border: 1px solid rgba(0, 0, 0, 0.2);
      }

      #map {
        flex: 1;
        min-height: 0;
      }

      .chart-tabs {
        display: flex;
        border-bottom: 1px solid #ddd;
        margin-bottom: 10px;
      }

      .chart-tab {
        flex: 1;
        padding: 8px 4px;
        text-align: center;
        cursor: pointer;
        font-size: 0.75em;
        color: #666;
        background: #f5f5f5;
        border: none;
        border-radius: 4px 4px 0 0;
        margin-right: 2px;
      }

      .chart-tab.active {
        background: #fff;
        color: #1b5e20;
        font-weight: 600;
        border-bottom: 2px solid #1b5e20;
      }

      .chart-container {
        display: none;
        width: 100%;
        max-width: 100%;
        height: 180px;
      }

      .chart-container.active {
        display: block;
      }

      .dem-controls {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #eee;
      }

      .dem-controls label {
        display: flex;
        align-items: center;
        font-size: 0.85em;
        color: #333;
        cursor: pointer;
      }

      .dem-controls input[type='checkbox'] {
        margin-right: 8px;
        cursor: pointer;
      }

      .opacity-slider {
        display: none;
        margin-top: 8px;
        padding: 8px;
        background: #f0f0f0;
        border-radius: 4px;
      }

      .opacity-slider.visible {
        display: block;
      }

      .opacity-slider label {
        display: block;
        font-size: 0.75em;
        color: #666;
        margin-bottom: 4px;
      }

      .opacity-slider input[type='range'] {
        width: 100%;
        cursor: pointer;
      }

      .opacity-value {
        font-size: 0.75em;
        color: #666;
        float: right;
      }

      #elevation-panel {
        display: none;
      }

      #elevation-panel.visible {
        display: block;
      }

      #colorbar {
        height: 20px;
        border-radius: 4px;
        margin: 8px 0 4px 0;
      }

      .colorbar-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7em;
        color: #666;
      }

      #field-details {
        display: none;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #ddd;
      }

      #field-details.visible {
        display: block;
      }

      .field-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .field-header h3 {
        color: #1b5e20;
        margin: 0;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 1.2em;
        cursor: pointer;
        color: #666;
        padding: 4px 8px;
      }

      .close-btn:hover {
        color: #333;
      }

      #toolbar {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        display: flex;
        gap: 8px;
      }

      #toolbar button {
        padding: 8px 14px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
      }

      #toolbar button:hover {
        background: #f0f0f0;
      }

      #toolbar button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #toolbar button.primary {
        background: #1b5e20;
        color: white;
        border-color: #1b5e20;
      }

      #toolbar button.primary:hover {
        background: #2e7d32;
      }

      .toolbar-divider {
        width: 1px;
        background: #ddd;
        margin: 0 4px;
      }

      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loading-content {
        background: white;
        padding: 30px 50px;
        border-radius: 8px;
        text-align: center;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #1b5e20;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button
        id="open-btn"
        onclick="document.getElementById('file-input').click()"
      >
        Open
      </button>
      <button id="save-btn" onclick="saveResults()" disabled>Save</button>
      <span class="toolbar-divider"></span>
      <button id="draw-btn" onclick="enableDrawing()">Draw</button>
      <button id="retrieve-btn" onclick="retrieveData()" disabled>
        Retrieve
      </button>
      <button id="clear-btn" onclick="clearAll()" disabled>Clear</button>
    </div>

    <input
      type="file"
      id="file-input"
      accept=".json"
      style="display: none"
      onchange="loadFile(event)"
    />

    <div id="container">
      <div id="sidebar">
        <h1>Custom Polygon Analysis</h1>
        <p style="font-size: 0.8em; color: #666; margin-bottom: 20px">
          Draw a polygon to retrieve data
        </p>

        <div class="panel" id="instructions-panel">
          <h3>Instructions</h3>
          <div style="font-size: 0.9em; color: #555; line-height: 1.5">
            <ol style="padding-left: 20px; margin: 0">
              <li style="margin-bottom: 8px">
                Click <strong>Draw</strong> to start drawing
              </li>
              <li style="margin-bottom: 8px">
                Click on the map to add polygon points
              </li>
              <li style="margin-bottom: 8px">
                Click first point to close polygon
              </li>
              <li style="margin-bottom: 8px">
                Click <strong>Retrieve</strong> to fetch data
              </li>
              <li style="margin-bottom: 8px">
                Click <strong>Save</strong> to download JSON
              </li>
            </ol>
          </div>
        </div>

        <div id="elevation-panel" class="panel">
          <h3>Elevation Scale</h3>
          <div id="colorbar"></div>
          <div class="colorbar-labels">
            <span id="colorbar-min">0m</span>
            <span id="colorbar-max">100m</span>
          </div>
        </div>

        <div id="field-details" class="panel">
          <div class="field-header">
            <h3>Field Details</h3>
            <button class="close-btn" onclick="closeFieldDetails()">×</button>
          </div>
          <div id="field-content"></div>
        </div>
      </div>

      <div id="map"></div>
    </div>

    <script>
      var monthLabels = [
        'Jan',
        'Feb',
        'Mar',
        'Apr',
        'May',
        'Jun',
        'Jul',
        'Aug',
        'Sep',
        'Oct',
        'Nov',
        'Dec',
      ];
      var soilLabels = ['Clay %', 'Sand %', 'Silt %', 'OM %', 'pH', 'CEC'];
      var soilKeys = [
        'soil_clay_pct',
        'soil_sand_pct',
        'soil_silt_pct',
        'soil_om_pct',
        'soil_ph',
        'soil_cec',
      ];
      var soilAverages = {
        soil_clay_pct: 24.4,
        soil_sand_pct: 20.7,
        soil_silt_pct: 54.9,
        soil_om_pct: 4.5,
        soil_ph: 6.0,
        soil_cec: 20.7,
      };

      var map = L.map('map').setView(
        [44.521600678003495, -123.03722545438418],
        6
      );

      L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
          attribution: 'Esri',
          maxZoom: 19,
        }
      ).addTo(map);

      L.control
        .scale({ imperial: true, metric: true, position: 'bottomright' })
        .addTo(map);

      var elevationRanges = {
        WV_AG_001: [151.0, 157.9],
        WV_AG_002: [102.8, 104.4],
        WV_AG_003: [66.6, 69.3],
        WV_AG_004: [96.7, 99.3],
        WV_AG_005: [53.9, 66.4],
        WV_AG_006: [174.2, 184.0],
        WV_AG_007: [226.2, 240.0],
        WV_AG_008: [260.7, 267.4],
        WV_AG_009: [101.6, 102.7],
        WV_AG_010: [113.4, 115.5],
        WV_AG_011: [177.0, 183.6],
        WV_AG_012: [101.2, 102.4],
        WV_AG_013: [79.8, 81.4],
        WV_AG_014: [72.0, 85.0],
        WV_AG_015: [94.2, 95.4],
        WV_AG_016: [77.5, 79.0],
        WV_AG_017: [62.4, 64.5],
        WV_AG_018: [104.1, 105.5],
        WV_AG_019: [90.7, 91.7],
        WV_AG_020: [45.2, 47.0],
        WV_AG_021: [77.0, 83.6],
        WV_AG_022: [65.8, 67.8],
        WV_AG_023: [56.0, 57.1],
        WV_AG_024: [97.3, 98.8],
        WV_AG_025: [72.1, 74.4],
        WV_AG_026: [78.1, 79.9],
        WV_AG_027: [75.8, 78.1],
        WV_AG_028: [53.5, 58.4],
        WV_AG_029: [87.4, 88.7],
        WV_AG_030: [97.9, 98.9],
        WV_AG_031: [94.8, 97.6],
        WV_AG_032: [90.8, 93.9],
        WV_AG_033: [72.1, 77.9],
        WV_AG_034: [118.6, 120.6],
        WV_AG_035: [226.3, 261.2],
        WV_AG_036: [104.7, 106.5],
        WV_AG_037: [71.1, 73.1],
        WV_AG_038: [177.5, 183.9],
        WV_AG_039: [52.6, 54.8],
        WV_AG_040: [116.9, 147.0],
        WV_AG_041: [81.7, 82.2],
        WV_AG_042: [79.1, 80.5],
        WV_AG_043: [103.6, 105.7],
        WV_AG_044: [103.2, 106.1],
        WV_AG_045: [186.5, 188.7],
        WV_AG_046: [75.1, 89.5],
        WV_AG_047: [68.1, 77.3],
        WV_AG_048: [103.7, 105.5],
        WV_AG_049: [58.7, 60.9],
        WV_AG_050: [56.8, 57.1],
      };
      var fieldData = { type: 'FeatureCollection', features: [] };

      var popupIdCounter = 0;
      var fieldLayer;
      var charts = {};
      var activeOverlays = {};
      var loadedImages = {};
      var drawnItems = new L.FeatureGroup();
      map.addLayer(drawnItems);

      var drawControl = new L.Control.Draw({
        draw: {
          polygon: {
            allowIntersection: false,
            showArea: true,
            shapeOptions: { color: '#1b5e20', fillOpacity: 0.2 },
          },
          polyline: false,
          rectangle: false,
          circle: false,
          marker: false,
          circlemarker: false,
        },
        edit: { featureGroup: drawnItems, remove: true },
      });

      map.addControl(drawControl);
      map.removeControl(drawControl);

      map.on(L.Draw.Event.CREATED, function (e) {
        drawnItems.clearLayers();
        drawnItems.addLayer(e.layer);
        document.getElementById('retrieve-btn').disabled = false;
        document.getElementById('clear-btn').disabled = false;
        document.getElementById('draw-btn').textContent = 'Draw';
        map.fire('draw:cancel');
      });

      map.on(L.Draw.Event.DRAWSTOP, function (e) {
        document.getElementById('draw-btn').textContent = 'Draw';
      });

      var currentResults = null;

      function enableDrawing() {
        map.addControl(drawControl);
        new L.Draw.Polygon(map, drawControl.options.draw.polygon).enable();
        document.getElementById('draw-btn').textContent = 'Drawing...';
      }

      function clearAll() {
        drawnItems.clearLayers();
        document.getElementById('retrieve-btn').disabled = true;
        document.getElementById('clear-btn').disabled = true;
        document.getElementById('save-btn').disabled = true;
        document.getElementById('draw-btn').textContent = 'Draw';
        currentResults = null;
        if (typeof closeFieldDetails === 'function') closeFieldDetails();
      }

      function getPolygonGeoJSON() {
        var layers = drawnItems.getLayers();
        if (layers.length === 0) return null;
        return layers[0].toGeoJSON();
      }

      function getPolygonCentroid(geojson) {
        var coords = geojson.geometry.coordinates[0];
        var latSum = 0,
          lonSum = 0;
        coords.forEach(function (c) {
          lonSum += c[0];
          latSum += c[1];
        });
        return { lat: latSum / coords.length, lon: lonSum / coords.length };
      }

      function getPolygonAreaAcres() {
        var layer = drawnItems.getLayers()[0];
        if (!layer) return 0;
        var coords = layer.toGeoJSON().geometry.coordinates[0];
        var area = 0;
        for (var i = 0; i < coords.length - 1; i++) {
          var lat1 = (coords[i][1] * Math.PI) / 180;
          var lat2 = (coords[i + 1][1] * Math.PI) / 180;
          var dLon = ((coords[i + 1][0] - coords[i][0]) * Math.PI) / 180;
          area += dLon * (2 + Math.sin(lat1) + Math.sin(lat2));
        }
        area = Math.abs((area * 6371000 * 6371000) / 2);
        return area * 0.000247105;
      }

      var currentElevationRange = null;
      var currentPolygonGeoJSON = null;

      function getPolygonBounds(geojson) {
        var coords = geojson.geometry.coordinates[0];
        var lats = coords.map(function (c) {
          return c[1];
        });
        var lons = coords.map(function (c) {
          return c[0];
        });
        return [
          [Math.min.apply(null, lats), Math.min.apply(null, lons)],
          [Math.max.apply(null, lats), Math.max.apply(null, lons)],
        ];
      }

      function loadCustomDemOverlay(geojson) {
        if (activeOverlays['custom']) {
          return;
        }
        var bounds = getPolygonBounds(geojson);
        if (!bounds) return;

        var demOverlay = L.tileLayer.wms(
          'https://elevation.nationalmap.gov/arcgis/services/3DEPElevation/ImageServer/WMSServer',
          {
            layers: '3DEPElevation',
            format: 'image/png',
            transparent: true,
            rasterFunction: 'Hillshade Gray',
          }
        );
        demOverlay.setBounds(bounds);
        demOverlay.addTo(map);
        activeOverlays['custom'] = demOverlay;
      }

      async function fetchElevationRange(geojson) {
        var centroid = getPolygonCentroid(geojson);
        var url =
          'https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/query?' +
          'where=1%3D1&geometry=' +
          centroid.lon +
          ',' +
          centroid.lat +
          '&geometryType=esriGeometryPoint&spatialRel=esriSpatialRelIntersects&f=json&returnCountOnly=false';
        try {
          var response = await fetchWithTimeout(url, {}, 15000);
          if (!response.ok) {
            console.error('Elevation API error:', response.status);
            return null;
          }
          var data = await response.json();
          if (
            data &&
            data.point &&
            data.point.attributes &&
            data.point.attributes.OBJECTID
          ) {
            var elev = data.point.attributes.ROI_Z;
            if (elev !== undefined && elev !== null) {
              return [Math.round(elev - 5), Math.round(elev + 5)];
            }
          }
          return null;
        } catch (e) {
          console.error('Elevation fetch error:', e);
          return null;
        }
      }

      function toggleDemOverlay(fieldId, popupId) {
        var checkbox = document.getElementById('dem-checkbox-' + popupId);
        var sliderContainer = document.getElementById(
          'opacity-slider-' + popupId
        );

        if (checkbox.checked) {
          sliderContainer.classList.add('visible');
          if (fieldId === 'custom' && currentPolygonGeoJSON) {
            loadCustomDemOverlay(currentPolygonGeoJSON);
          } else {
            loadDemOverlay(fieldId);
          }
          if (fieldId !== 'custom') {
            setCropLayerOpacity(fieldId, 0);
          }
        } else {
          sliderContainer.classList.remove('visible');
          removeDemOverlay(fieldId);
          if (fieldId !== 'custom') {
            setCropLayerOpacity(fieldId, 0.5);
          }
        }
        updateColorbar();
      }

      function updateOpacity(fieldId, value, popupId) {
        var opacityDisplay = document.getElementById(
          'opacity-value-' + popupId
        );
        opacityDisplay.textContent = value + '%';

        if (activeOverlays[fieldId]) {
          activeOverlays[fieldId].setOpacity(value / 100);
        }
      }

      function loadDemOverlay(fieldId) {
        if (activeOverlays[fieldId]) {
          return;
        }

        if (!loadedImages[fieldId]) {
          var img = new Image();
          img.src = 'dem/dem_' + fieldId + '.png';
          loadedImages[fieldId] = img;
        }

        var range = elevationRanges[fieldId];
        if (!range) return;

        var bounds = getFieldBounds(fieldId);
        if (!bounds) return;

        var overlay = L.imageOverlay('dem/dem_' + fieldId + '.png', bounds, {
          opacity: 0.7,
        }).addTo(map);

        activeOverlays[fieldId] = overlay;
      }

      function getFieldBounds(fieldId) {
        var features = fieldData.features;
        for (var i = 0; i < features.length; i++) {
          if (features[i].properties.field_id === fieldId) {
            var geom = features[i].geometry;
            if (geom.type === 'Polygon') {
              var coords = geom.coordinates[0];
              var lats = coords.map(function (c) {
                return c[1];
              });
              var lons = coords.map(function (c) {
                return c[0];
              });
              return [
                [Math.min.apply(null, lats), Math.min.apply(null, lons)],
                [Math.max.apply(null, lats), Math.max.apply(null, lons)],
              ];
            }
          }
        }
        return null;
      }

      function removeDemOverlay(fieldId) {
        if (activeOverlays[fieldId]) {
          map.removeLayer(activeOverlays[fieldId]);
          delete activeOverlays[fieldId];
        }
        updateColorbar();
      }

      async function fetchWithTimeout(url, options = {}, timeoutMs = 30000) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(url, {
            ...options,
            signal: controller.signal,
          });
          clearTimeout(timeout);
          return response;
        } catch (error) {
          clearTimeout(timeout);
          if (error.name === 'AbortError') {
            throw new Error(
              'Request timed out after ' + timeoutMs / 1000 + ' seconds'
            );
          }
          throw error;
        }
      }

      async function retrieveData() {
        var geojson = getPolygonGeoJSON();
        if (!geojson) {
          alert('Please draw a polygon first');
          return;
        }
        showLoading('Fetching data...');
        console.log('Starting data retrieval for polygon...');
        try {
          var centroid = getPolygonCentroid(geojson);
          var areaAcres = getPolygonAreaAcres();
          console.log('Centroid:', centroid, 'Area:', areaAcres, 'acres');
          var [soilData, weatherData, cropData] = await Promise.all([
            fetchSoilData(geojson),
            fetchWeatherData(centroid),
            fetchCropData(geojson),
          ]);
          console.log('All data retrieved:', {
            soilData,
            weatherData,
            cropData,
          });

          showLoading('Fetching elevation data...');
          var elevRange = await fetchElevationRange(geojson);
          if (!elevRange) {
            elevRange = [95, 105];
          }
          console.log('Elevation range:', elevRange);
          hideLoading();

          currentResults = {
            version: '1.0',
            created: new Date().toISOString(),
            geometry: geojson,
            area: { centroid: centroid, area_acres: areaAcres },
            data: {
              cdl_crop: cropData.crop,
              crop_dominant_pct: cropData.percent,
              soil_muname: soilData.muname,
              soil_drainage: soilData.drainage,
              soil_clay_pct: soilData.clay,
              soil_sand_pct: soilData.sand,
              soil_silt_pct: soilData.silt,
              soil_om_pct: soilData.om,
              soil_ph: soilData.ph,
              soil_cec: soilData.cec,
              elevation_range: elevRange,
              weather_avg_monthly: weatherData,
            },
          };
          displayResults(currentResults);
          document.getElementById('save-btn').disabled = false;
          hideLoading();
        } catch (error) {
          hideLoading();
          console.error('Data retrieval error:', error);
          alert('Error fetching data: ' + error.message);
        }
      }

      async function fetchWeatherData(centroid) {
        var endDate = new Date(),
          startDate = new Date();
        startDate.setFullYear(startDate.getFullYear() - 5);
        var url =
          'https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,T2M_MAX,T2M_MIN,PRECTOTCORR&community=AG&longitude=' +
          centroid.lon +
          '&latitude=' +
          centroid.lat +
          '&start=' +
          startDate.toISOString().slice(0, 10).replace(/-/g, '') +
          '&end=' +
          endDate.toISOString().slice(0, 10).replace(/-/g, '') +
          '&format=JSON';
        console.log('Fetching weather from:', url);
        var response = await fetchWithTimeout(url, {}, 45000);
        if (!response.ok)
          throw new Error('Weather API error: ' + response.status);
        var data = await response.json();
        console.log('Weather data received:', data);
        var temps = data.properties.parameter,
          months = {};
        Object.keys(temps.T2M).forEach(function (date) {
          var month = parseInt(date.substring(4, 6)) - 1;
          if (!months[month]) months[month] = { high: [], low: [], rain: [] };
          months[month].high.push(temps.T2M_MAX[date]);
          months[month].low.push(temps.T2M_MIN[date]);
          months[month].rain.push(temps.PRECTOTCORR[date] / 25.4);
        });
        var avgHigh = [],
          avgLow = [],
          avgRain = [];
        for (var i = 0; i < 12; i++) {
          var m = months[i];
          if (m) {
            avgHigh.push(
              (
                m.high.reduce(function (a, b) {
                  return a + b;
                }, 0) / m.high.length
              ).toFixed(1)
            );
            avgLow.push(
              (
                m.low.reduce(function (a, b) {
                  return a + b;
                }, 0) / m.low.length
              ).toFixed(1)
            );
            avgRain.push(
              (
                m.rain.reduce(function (a, b) {
                  return a + b;
                }, 0) / 5
              ).toFixed(2)
            );
          } else {
            avgHigh.push(0);
            avgLow.push(0);
            avgRain.push(0);
          }
        }
        return {
          avg_high_c: avgHigh.map(Number),
          avg_low_c: avgLow.map(Number),
          avg_rain_in: avgRain.map(Number),
        };
      }

      async function fetchSoilData(geojson) {
        var coords = geojson.geometry.coordinates[0];
        var wkt =
          'POLYGON((' +
          coords
            .map(function (c) {
              return c[0] + ' ' + c[1];
            })
            .join(', ') +
          '))';
        console.log('Soil query WKT:', wkt);
        var query = {
          query:
            'SELECT musym, muname, drainagecl, claytotal_r, sandtotal_r, silttotal_r, om_r, ph1_1e3_r, cec7_r ' +
            'FROM component (NOLOCK) ' +
            'JOIN legend (NOLOCK) ON legend.lkey = component.lkey ' +
            'JOIN mapunit (NOLOCK) ON mapunit.mukey = component.mukey ' +
            "WHERE mapunit.mukey IN (SELECT * FROM SDA_Get_Mukey_from_intersection_with_WktWgs84('" +
            wkt +
            "')) " +
            'ORDER BY component.comppct_r DESC LIMIT 1',
        };
        console.log('Fetching soil data from SDA...');
        try {
          var response = await fetchWithTimeout(
            'https://sdmdataaccess.sc.egov.usda.gov/Tabular/post.rest',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(query),
            },
            60000
          );
          if (!response.ok) {
            console.error(
              'Soil API error:',
              response.status,
              response.statusText
            );
            return getPlaceholderSoilData();
          }
          var result = await response.json();
          console.log('Soil result:', result);
          if (!result || !result.length || !result[0].length) {
            console.error('Soil data empty or invalid');
            return getPlaceholderSoilData();
          }
          var row = result[0][0];
          return {
            muname: row.muname || 'Unknown',
            drainage: row.drainagecl || 'Unknown',
            clay: row.claytotal_r || 0,
            sand: row.sandtotal_r || 0,
            silt: row.silttotal_r || 0,
            om: row.om_r || 0,
            ph: row.ph1_1e3_r || 0,
            cec: row.cec7_r || 0,
          };
        } catch (e) {
          console.error('Soil fetch error:', e);
          return getPlaceholderSoilData();
        }
      }

      function getPlaceholderSoilData() {
        return {
          muname: 'Data unavailable',
          drainage: 'Unknown',
          clay: 0,
          sand: 0,
          silt: 0,
          om: 0,
          ph: 0,
          cec: 0,
        };
      }

      async function fetchCropData(geojson) {
        var coords = geojson.geometry.coordinates[0];
        var ring = coords.map(function (c) {
          return [c[1], c[0]];
        });
        ring.push(ring[0]);
        var geometry = JSON.stringify({
          rings: [ring],
          spatialReference: { wkid: 4326 },
        });
        var url =
          'https://nassgeodata.gmu.edu/arcgis/rest/services/CropScapeR28/MapServer/18/query?geometry=' +
          encodeURIComponent(geometry) +
          '&geometryType=esriGeometryPolygon&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=false&f=json';
        console.log('Fetching crop data from:', url);
        try {
          var response = await fetchWithTimeout(url, {}, 30000);
          if (!response.ok)
            throw new Error('CDL API error: ' + response.status);
          var data = await response.json();
          console.log('CDL data received:', data);
          if (!data.features || data.features.length === 0) {
            console.log('No crop features found');
            return { crop: 'No crop data', percent: 0 };
          }
          var crops = {};
          data.features.forEach(function (f) {
            var val = f.attributes.Value,
              pct = f.attributes.Percent;
            if (val && pct > 0) crops[val] = (crops[val] || 0) + pct;
          });
          var dominant = Object.keys(crops).reduce(function (a, b) {
            return crops[a] > crops[b] ? a : b;
          }, Object.keys(crops)[0]);
          return {
            crop: getCropName(parseInt(dominant)),
            percent: Math.round(crops[dominant]),
          };
        } catch (e) {
          console.error('CDL fetch error:', e);
          return { crop: 'Data unavailable', percent: 0 };
        }
      }

      function saveResults() {
        if (!currentResults) {
          alert('No results to save');
          return;
        }
        var json = JSON.stringify(currentResults, null, 2);
        var blob = new Blob([json], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download =
          'field-data-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function loadFile(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          try {
            var data = JSON.parse(e.target.result);
            if (!data.version || !data.geometry || !data.data)
              throw new Error('Invalid file format');
            var layer = L.geoJSON(data.geometry, {
              style: { color: '#1b5e20', fillOpacity: 0.2 },
            }).addTo(map);
            drawnItems.addLayer(layer);
            map.fitBounds(layer.getBounds());
            currentResults = data;
            displayResults(data);
            document.getElementById('save-btn').disabled = false;
            document.getElementById('retrieve-btn').disabled = false;
            document.getElementById('clear-btn').disabled = false;
          } catch (err) {
            alert('Error loading file: ' + err.message);
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      }

      function updateColorbar() {
        var activeFields = Object.keys(activeOverlays);
        var panel = document.getElementById('elevation-panel');
        var colorbar = document.getElementById('colorbar');
        var minLabel = document.getElementById('colorbar-min');
        var maxLabel = document.getElementById('colorbar-max');

        if (activeFields.length === 0) {
          panel.classList.remove('visible');
          return;
        }

        panel.classList.add('visible');

        var globalMin = Infinity;
        var globalMax = -Infinity;

        activeFields.forEach(function (fieldId) {
          var range = elevationRanges[fieldId];
          if (range) {
            globalMin = Math.min(globalMin, range[0]);
            globalMax = Math.max(globalMax, range[1]);
          }
        });

        var gradient = 'linear-gradient(to right, ';
        var steps = 10;
        for (var i = 0; i <= steps; i++) {
          var t = i / steps;
          var color = inferno(t);
          gradient += color + (i < steps ? ', ' : '');
        }
        gradient += ')';

        colorbar.style.background = gradient;
        minLabel.textContent = Math.round(globalMin) + 'm';
        maxLabel.textContent = Math.round(globalMax) + 'm';
      }

      function inferno(t) {
        var colors = [
          [0.001462, 0.000466, 0.013866],
          [0.258234, 0.038571, 0.406153],
          [0.578115, 0.148255, 0.40482],
          [0.865006, 0.317075, 0.226467],
          [0.987158, 0.645276, 0.039486],
          [0.996078, 0.999338, 0.410835],
          [1.0, 1.0, 1.0],
        ];

        var idx = t * (colors.length - 1);
        var i = Math.floor(idx);
        var f = idx - i;

        if (i >= colors.length - 1)
          return (
            'rgb(' +
            Math.round(colors[colors.length - 1][0] * 255) +
            ',' +
            Math.round(colors[colors.length - 1][1] * 255) +
            ',' +
            Math.round(colors[colors.length - 1][2] * 255) +
            ')'
          );

        var r = Math.round(
          (colors[i][0] * (1 - f) + colors[i + 1][0] * f) * 255
        );
        var g = Math.round(
          (colors[i][1] * (1 - f) + colors[i + 1][1] * f) * 255
        );
        var b = Math.round(
          (colors[i][2] * (1 - f) + colors[i + 1][2] * f) * 255
        );

        return 'rgb(' + r + ',' + g + ',' + b + ')';
      }
